<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yukvix — Premium Cosplay Gallery</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Discover thousands of stunning cosplay photos from talented cosplayers worldwide. Join VIP for exclusive high-resolution galleries." />
    <meta name="keywords" content="cosplay, cosplay gallery, cosplay photos, anime cosplay, VIP gallery, premium cosplay" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        var KEY = "yukvix_age_confirmed";
        function skip() {
          try {
            return /\/(privacy|terms|dmca|contact|about|info|login|register|forgot-password|reset-password|verify-email|admin|vip|payment)(\/|$)/.test(location.pathname);
          } catch (e) { return false; }
        }
        function confirmed() {
          try { if (localStorage.getItem(KEY) === "1") return true; } catch (e) {}
          try { return document.cookie.indexOf(KEY + "=1") !== -1; } catch (e) { return false; }
        }
        if (confirmed() || skip()) document.documentElement.className += " age-ok";
      })();
    </script>
    <style>
      html, body { background: #0a0a0f; color: #f4f4f5; margin: 0; }
      #age-gate-boot {
        position: fixed; inset: 0; z-index: 2147483646;
        display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #0a0a0f;
        font-family: system-ui, -apple-system, sans-serif;
      }
      html.age-ok #age-gate-boot { display: none !important; }
      #age-gate-boot .ag-card {
        width: 100%; max-width: 400px; background: #16161f;
        border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;
        padding: 28px 24px; color: #fff; text-align: center;
      }
      #age-gate-boot h1 { margin: 0 0 12px; font-size: 22px; }
      #age-gate-boot p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #d4d4d8; }
      #age-gate-boot button {
        display: block; width: 100%; height: 48px; border: 0; border-radius: 8px;
        font-size: 16px; font-weight: 600; cursor: pointer;
      }
      #age-gate-boot .ag-yes { background: #f59e0b; color: #111; margin-bottom: 10px; }
      #age-gate-boot .ag-no { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    </style>
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Yukvix — Premium Cosplay Gallery" />
    <meta property="og:description" content="Discover thousands of stunning cosplay photos from talented cosplayers worldwide. Join VIP for exclusive high-resolution galleries." />
    <meta property="og:site_name" content="Yukvix" />
    <meta property="og:url" content="https://yukvix.com" />
    <meta property="og:image" content="https://yukvix.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yukvix — Premium Cosplay Gallery" />
    <meta name="twitter:image" content="https://yukvix.com/og-default.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="age-gate-boot" role="dialog" aria-modal="true">
      <div class="ag-card">
        <h1 id="age-gate-title">Are you 18 or older?</h1>
        <p id="age-gate-body">Yukvix contains adult-oriented cosplay photography. You must be at least 18 years old to enter this site.</p>
        <button type="button" class="ag-yes" id="age-gate-yes">I am 18 or older</button>
        <button type="button" class="ag-no" id="age-gate-no">Leave</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var KEY = "yukvix_age_confirmed";
        var vi = false;
        try { vi = ((navigator.language || "") + "").toLowerCase().indexOf("vi") === 0; } catch (e) {}
        if (vi) {
          var title = document.getElementById("age-gate-title");
          var body = document.getElementById("age-gate-body");
          var yes = document.getElementById("age-gate-yes");
          var no = document.getElementById("age-gate-no");
          if (title) title.textContent = "Bạn đã đủ 18 tuổi?";
          if (body) body.textContent = "Yukvix chứa ảnh cosplay dành cho người lớn. Bạn phải từ 18 tuổi trở lên để vào trang.";
          if (yes) yes.textContent = "Tôi đã đủ 18 tuổi";
          if (no) no.textContent = "Rời đi";
        }
        var yesBtn = document.getElementById("age-gate-yes");
        var noBtn = document.getElementById("age-gate-no");
        if (yesBtn) yesBtn.onclick = function () {
          try { localStorage.setItem(KEY, "1"); } catch (e) {}
          var secure = location.protocol === "https:" ? "; Secure" : "";
          document.cookie = KEY + "=1; Path=/; Max-Age=31536000; SameSite=Lax" + secure;
          try {
            if (/(^|\.)yukvix\.com$/i.test(location.hostname)) {
              document.cookie = KEY + "=1; Domain=.yukvix.com; Path=/; Max-Age=31536000; SameSite=Lax" + secure;
            }
          } catch (e) {}
          document.documentElement.className += " age-ok";
          var wrap = document.getElementById("age-gate-boot");
          if (wrap) wrap.remove();
        };
        if (noBtn) noBtn.onclick = function () {
          location.href = "https://www.google.com";
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
